[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-classifier"
version = "0.1.0"
description = "CIFAR-10 image classification with standard and adversarial training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "tqdm>=4.66.0",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data*", ".venv*"]

[tool.pyright]
extraPaths = ["."]
